name: Release main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]' && !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install display server for extension-host tests
        run: sudo apt-get update && sudo apt-get install --yes xvfb
      - name: Install dependencies
        run: npm ci
      - name: Bump the zero-major minor version
        run: npm version minor --no-git-tag-version
      - name: Test
        run: xvfb-run --auto-servernum npm test
      - name: Package VSIX
        run: npm run package:vsix
      - name: Commit and tag release
        id: version
        run: |
          VERSION="$(node --print "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): v${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin HEAD:main --follow-tags
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Publish to the Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "VSCE_PAT is not configured; skipping Marketplace publication."
            exit 0
          fi
          npm run publish:marketplace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "v${VERSION}" --generate-notes "openpatch-${VERSION}.vsix"
